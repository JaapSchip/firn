<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firn – Jungfrau Ski Guide</title>
<meta name="description" content="Onafhankelijke skigids voor Wengen, Mürren en Grindelwald: kaart, liften, restaurants, skischolen en aanreis.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Firn">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Rustig en helder: lichtgrijs vlak, witte kaarten, bijna-zwarte actieblokken, beeld groot.
   Vier tabs, de rest zit één tik diep. Oranje alleen voor wat je nu moet zien. */
:root{
  --snow:#F4F4F6; --card:#FFFFFF; --ink:#222224; --muted:#6F6F76; --line:#E2E2E7;
  --pole:#E8540A; --pole-ink:#FFFFFF; --glacier:#DCE8F0; --valley:#E7EAEF;
  --pblue:#1C6DD0; --pred:#D42A3A; --pblack:#16161A; --ok:#1E8E5A; --warn:#C98A00; --sos:#C94444;
  --display:"Work Sans",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans",sans-serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--snow);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative;overflow:hidden;background:var(--snow)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:0 20px 36px}
.view.on{display:block;animation:vin .22s ease}
@keyframes vin{from{opacity:.3;transform:translateY(8px)}}
#v-kaart.on{display:flex;flex-direction:column;height:100%;padding:0}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:40px;font-weight:700}
h2{font-size:26px;font-weight:700;margin:0}
h3{font-size:18px;font-weight:600}
p{margin:0 0 10px}
a{color:var(--ink);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--pole);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13.5px}.num{font-variant-numeric:tabular-nums}
.lead{color:var(--ink);font-size:16px;margin:6px 0 14px}
[hidden]{display:none!important}

.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);box-shadow:0 1px 0 var(--line);z-index:5;min-height:60px}
.topbar .ttl{flex:1;text-align:center;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sosb{background:var(--sos);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;letter-spacing:.03em}
.ib{width:40px;height:40px;border-radius:11px;background:var(--ink);color:#fff;border:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.back{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#guideBtn{display:none}.has-ai #guideBtn{display:flex}
.left{width:92px;display:flex;gap:8px}.right{width:92px;display:flex;gap:8px;justify-content:flex-end}

nav.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;background:none;border:0;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:500;color:#9A968A;min-width:0;white-space:nowrap}
nav.tabs button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink)}

.hero{margin:0 -20px;position:relative;overflow:hidden;aspect-ratio:16/11;max-height:46vh;background:var(--glacier)}
.hero img,.hero svg,.hero video{display:block;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(to bottom,rgba(244,244,246,0),var(--snow))}
.sky-day{--s1:#4FA5E8;--s2:#D8ECFA;--rk:#4B6074;--rk2:#3A4C5D;--far:#8FB0CC;--cap:#FFFFFF;--orb:#FFF3B0}
.sky-dawn{--s1:#F2996F;--s2:#FBE4C8;--rk:#5D5A72;--rk2:#474460;--far:#B79AA8;--cap:#FFE3D3;--orb:#FFD27A}
.sky-glow{--s1:#D9644F;--s2:#F8C79E;--rk:#6A4F68;--rk2:#523C55;--far:#B98493;--cap:#FFB7A6;--orb:#FFB36B}
.sky-night{--s1:#060F1F;--s2:#1E3A63;--rk:#22344A;--rk2:#18273A;--far:#2B4666;--cap:#B9CCE2;--orb:#F4F1DE}
.title{position:relative;margin-top:-54px;z-index:1}
.title .sub{color:var(--ink);margin-top:8px;font-size:17px}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 6px}
.qab{background:var(--ink);color:#fff;border:0;border-radius:14px;padding:16px 14px;display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;font-weight:500;min-height:64px;line-height:1.2}
.qab svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qab.ai{display:none;background:var(--pole)}.has-ai .qab.ai{display:flex}
.sec{margin:0 -20px;padding:26px 20px 4px;border-top:8px solid #EEEEF1;margin-top:26px}
.imgcard{display:block;width:100%;border:0;padding:0;background:none;border-radius:16px;overflow:hidden;aspect-ratio:16/10}
.imgcard img,.banner img{display:block;width:100%;height:100%;object-fit:cover}
.banner{margin:0 -20px 18px;aspect-ratio:16/9;overflow:hidden}
.ph{width:100%;height:100%;position:relative}.ph svg{position:absolute;inset:0;width:100%;height:100%}
.ph-food,.ph-food2{background:linear-gradient(160deg,#F6B85C,#E8540A)}.ph-village{background:linear-gradient(160deg,#7FB6E8,#C9DFF2)}.ph-lift{background:linear-gradient(160deg,#3F8FDB,#A9D3F5)}.ph-piste,.ph-hero{background:linear-gradient(160deg,#2F7FD0,#BFE0FA)}
.reel{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.shot{flex:none;height:280px;margin:0;border:0;padding:0;border-radius:16px;overflow:hidden;position:relative;scroll-snap-align:center;background:var(--card);color:#fff;cursor:zoom-in}
.shot img,.shot video{display:block;height:100%;width:auto;max-width:84vw;object-fit:cover}
.shot span{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;font-weight:600;font-size:14px;text-align:left;background:linear-gradient(to bottom,transparent,rgba(20,20,24,.8))}
.lbox{position:fixed;inset:0;z-index:90;background:rgba(20,20,24,.94);display:none;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
.lbox.on{display:flex}
.lbox img,.lbox video{max-width:100%;max-height:100%;border-radius:14px}
.lbox button{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:999px;border:0;background:#fff;color:#222224;font-size:22px;line-height:1}
.tiles{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:62%;max-width:260px;border:0;padding:0;background:none;text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.tile .art{aspect-ratio:4/3;border-radius:16px;position:relative;overflow:hidden;color:#fff}
.tile .art svg{position:absolute;inset:0;width:100%;height:100%}
.tile .n{position:absolute;left:14px;bottom:8px;font-weight:700;font-size:64px;line-height:1}
.tile b{font-size:18px;font-weight:600;line-height:1.15}
.tile .tm{font-size:14px;color:var(--muted)}

.card{background:var(--card);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.count{display:flex;gap:14px;align-items:center}
.count .big{font-weight:700;font-size:60px;line-height:.9}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:500;font-size:15px}
.btn.alt{background:var(--ink);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:8px 13px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.xs{padding:5px 11px;font-size:13px}
.chip.q0[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chip.q1[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1a1200}
.chip.q2[aria-pressed="true"]{background:var(--pred);border-color:var(--pred)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--snow);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-blue{background:var(--pblue)}.d-red{background:var(--pred)}.d-black{background:var(--pblack)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
details{border-top:1px solid var(--line);padding:12px 0}
details summary{font-weight:600;cursor:pointer}
details.area{border:0;padding:0;margin-top:14px}
details.area>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:16px;padding:16px;font-size:18px;font-weight:600}
details.area>summary::-webkit-details-marker{display:none}
details.area>summary::after{content:"+";font-size:24px;font-weight:400;color:var(--muted)}
details.area[open]>summary::after{content:"−"}
details.area>.stack{margin-top:12px}
ol,ul{margin:8px 0 0;padding-left:20px}li{margin-bottom:4px}
.lsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ls{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px}
.ls.hi{background:var(--card)}
.ring{width:48px;height:48px;border-radius:50%;border:5px solid var(--c,var(--line));display:flex;align-items:center;justify-content:center;flex:none}
.ring svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ls b{display:block;font-size:20px;font-weight:700;line-height:1.1}.ls span{font-size:13px;color:var(--muted);line-height:1.2;display:block}

.maptop{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px;background:var(--snow)}
.mapwrap{flex:1;min-height:0;overflow:auto;background:#EDF2F6;border-top:1px solid var(--line)}
#map{display:block;width:940px;height:auto}
#map text{font-family:var(--body);font-weight:600;font-size:14px;fill:#fff;paint-order:stroke;stroke:#2B2B2F;stroke-width:7px;stroke-linejoin:round}
#map text.area{font-size:17px;font-weight:700;fill:var(--muted);opacity:.6;stroke:none;letter-spacing:.08em}
#map text.pk{font-size:12.5px;fill:var(--muted);stroke:#EDF2F6;stroke-width:4px}
#map .trein{stroke:var(--ink);stroke-width:4;fill:none}
#map .trein2{stroke:#EDF2F6;stroke-width:2;stroke-dasharray:7 7;fill:none}
#map .kabel{stroke:#8E8E96;stroke-width:3;fill:none}
#map .stoel{stroke:#8E8E96;stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round;fill:none}
#map .cab{fill:var(--ink);stroke:#fff;stroke-width:1.5}
#map .piste{fill:none;stroke-width:5;stroke-linecap:round;opacity:.9}
#map .p-blue{stroke:var(--pblue)}#map .p-red{stroke:var(--pred)}#map .p-black{stroke:var(--pblack)}
#map .node{cursor:pointer}
#map .ring{fill:none;stroke:var(--pole);stroke-width:3;display:none;border:0}
#map[data-f="eten"] .ring.food,#map[data-f="fun"] .ring.fun{display:block}
#map[data-f="eten"] .lifts,#map[data-f="fun"] .lifts,#map[data-f="pistes"] .lifts{opacity:.18}
#map[data-f="eten"] .pistes,#map[data-f="fun"] .pistes,#map[data-f="liften"] .pistes{opacity:.12}
#map .hl{fill:none;stroke:var(--pole);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 14;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:20px;height:0;border-top:3px solid var(--ink);vertical-align:middle;margin-right:4px}
.kaartbox{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:42px;height:42px;border-radius:12px;background:var(--card);border:0;font-size:22px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.22);max-height:62%;overflow:auto;display:none;z-index:3}
.sheet.on{display:block;animation:vin .22s ease}
.x{float:right;background:var(--snow);border:0;border-radius:50%;width:36px;height:36px;font-size:20px;line-height:1}
.routebar{display:none;background:var(--ink);color:#fff;padding:9px 16px;font-weight:600;font-size:14px;align-items:center;justify-content:space-between;gap:8px}
.routebar.on{display:flex}
.routebar button{background:none;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:3px 10px;font-weight:500}

.route{display:grid;grid-template-columns:auto 1fr;gap:14px}
.route .no{font-weight:700;font-size:34px;line-height:1;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;border-radius:14px}
.route.done .no{background:var(--ok)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.lift{display:flex;flex-direction:column;gap:5px}
.lift .path{font-size:13.5px;color:var(--muted)}
.qrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.eat{display:flex;gap:10px;align-items:flex-start}
.eat .body{flex:1;min-width:0}
.heart{background:none;border:0;font-size:26px;line-height:1;padding:2px;color:var(--muted)}
.heart[aria-pressed="true"]{color:var(--pred)}
.eat.pick{outline:3px solid var(--pole)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.gcard{text-align:left;background:var(--card);border:0;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.gcard.wide{grid-column:1/-1;background:var(--ink);color:#fff;min-height:140px;justify-content:flex-end}
.gcard.wide .muted{color:#fff;opacity:.8}
.gcard b{font-size:19px;font-weight:600;line-height:1.1}.gcard.wide b{font-size:26px;font-weight:700}
.panel{display:none}.panel.on{display:block}
.hud{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin:14px 0 6px}
.hud div{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.hud b{display:block;font-weight:700;font-size:21px;color:var(--ink);line-height:1.1;text-transform:none}
#race{display:block;width:100%;border-radius:16px;touch-action:none;background:#fff}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px;background:rgba(20,20,24,.78);color:#fff;border-radius:16px}
.overlay h3{font-size:30px;font-weight:700}.overlay input{max-width:180px}.overlay .btn{background:#fff;color:var(--ink)}
.racebox{position:relative}
.q-opt{display:block;width:100%;text-align:left;background:var(--snow);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font-weight:500}
.q-opt.good{border-color:var(--ok);background:#E3F4EB}.q-opt.bad{border-color:var(--pred);background:#FBE6E8}
.bingo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bingo button{aspect-ratio:1;background:var(--card);border:0;border-radius:12px;font-size:11.5px;font-weight:500;padding:4px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.bingo button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bib{display:inline-block;font-weight:700;background:var(--ink);color:#fff;padding:2px 8px;border-radius:6px}
.flip{background:var(--card);border:0;border-radius:14px;padding:14px;text-align:left;width:100%}
.flip b{font-size:18px;font-weight:600}.flip span{display:block;color:var(--muted);font-size:14px}
.flips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:7px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
.modal{position:absolute;inset:0;z-index:10;background:rgba(20,20,24,.5);display:none;align-items:flex-end}
.modal.on{display:flex}
.mbox{background:var(--snow);width:100%;max-height:88%;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .25s ease;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.mhead{display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 13px;border-radius:16px;max-width:88%;white-space:pre-wrap;font-size:15px}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langs button{background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:14px;font-weight:600;text-align:left}
.langs button[aria-pressed="true"]{border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){.view.on,.sheet.on,.mbox,#map .hl{animation:none}}

/* ---- Stijl van jachthavenuithoorn: één groot beeld, dan veel lucht. Lichte grote letters, diepblauw op wit, beelden in afgeronde kaders, geen accentkleur. ---- */
:root{
  --snow:#FFFFFF; --card:#F2F4F8; --ink:#0A1633; --muted:#4B5675; --hush:#C3C9D6; --line:#E3E7EF;
  --pole:#0A1633; --pole-ink:#FFFFFF; --glacier:#E4EAF3; --valley:#EEF1F6; --r:22px;
  --display:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif; --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
body{font-size:17px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:300;letter-spacing:-.02em;line-height:1.05}
h2{font-size:clamp(2.1rem,9vw,3.2rem)}
h3{font-size:1.45rem;font-weight:400;letter-spacing:-.01em}
.lead{font-size:1.06rem;color:var(--muted);margin:14px 0 26px;max-width:34ch}
#v-routes .lead,#v-eten .lead,#v-reis .lead{max-width:none}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor;font-weight:400}
.label,.pill{font-family:var(--body);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.pill{background:transparent;border:1px solid var(--line);padding:3px 10px}

  MD.places.concat(MD.stations).forEach(x=>add({key:'pl:'+x.n,kind:'place',n:x.n,sub:'',go:()=>{show('kaart',true);setTimeout(()=>mapMsg({k:'go',p:x.p,n:x.n}),150)}}));
  MD.peaks.forEach(x=>add({key:'pl:'+x.n,kind:'place',n:x.n,sub:x.e+' m',go:()=>{show('kaart',true);setTimeout(()=>mapMsg({k:'go',p:x.p,n:x.n}),150)}}));
  IDX=out}
function mapPick(kind,i){show('kaart',true);setTimeout(()=>mapMsg({k:'pick',kind,i}),150)}
const favs=()=>S.get('fav2',[]).concat(st('fav',[]).map(x=>'e:'+x));
function favTog(key){if(key.startsWith('e:')){toggleFav(key.slice(2))}else{const f=S.get('fav2',[]),i=f.indexOf(key);i<0?f.push(key):f.splice(i,1);S.set('fav2',f)}drawSearch()}
const KIND=[['eat','kEat'],['route','qaRoutes'],['do','qaDo'],['lift','kLift'],['piste','kPiste'],['school','kSchool'],['place','kPlace']];
function srow(o,fv){const f=fv.includes(o.key);return `<div class="sr"><button class="go" data-k="${esc(o.key)}"><span>${esc(o.n)}</span>${o.sub?`<small>${esc(o.sub)}</small>`:''}</button><button class="heart" aria-label="♥" aria-pressed="${f}" data-f="${esc(o.key)}">${f?'♥':'♡'}</button></div>`}
function drawSearch(){if(!IDX)buildIdx();const q=nrm($('#sq').value),raw=$('#sq').value.trim().toLowerCase(),fv=favs();$('#sq').placeholder=t('sPh');let h='';
  if(!raw){const fl=IDX.filter(o=>fv.includes(o.key));h=`<div class="sgh">${t('sFav')}</div>`+(fl.length?fl.map(o=>srow(o,fv)).join(''):`<p class="shint">${t('sNoFav')}</p>`)}
  else{const hit=IDX.filter(o=>(q&&o.q.includes(q))||o.q.includes(raw)).sort((a,b)=>(a.q.startsWith(q)?0:1)-(b.q.startsWith(q)?0:1)||a.n.localeCompare(b.n));
    h=hit.length?KIND.map(([k,l])=>{const g=hit.filter(o=>o.kind===k).slice(0,12);return g.length?`<div class="sgh">${t(l)}</div>`+g.map(o=>srow(o,fv)).join(''):''}).join(''):`<p class="shint">${t('sNone')}</p>`}
  $('#sres').innerHTML=h}
$('#sq').addEventListener('input',drawSearch);
$('#sres').addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){favTog(f.dataset.f);return}const b=e.target.closest('[data-k]');if(b){const o=IDX.find(x=>x.key===b.dataset.k);if(o)o.go()}});
$('#srchBtn').onclick=()=>{show('zoek',true);drawSearch();setTimeout(()=>$('#sq').focus(),80)};
$('#eatAll').onclick=()=>{show('kaart',true);setTimeout(()=>mapMsg({k:'layer',l:'food',on:true}),150)};
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||!e.data.firn)return;if(e.data.k==='eat'&&e.data.id)openEat(e.data.id)});
$('#realmap').addEventListener('load',()=>mapMsg({k:'cur',m:FM}));
const _ra0=renderAll;renderAll=function(){_ra0();IDX=null;drawDo();$('#eatAll').textContent=t('eatAll',{n:MD.food.length});$('#srchBtn').setAttribute('aria-label',t('sH'));if(curView==='zoek')drawSearch();if(curView==='plek')drawPlace()};
const _show0=show;show=function(tb,push){_show0(tb,push);$('#srchBtn').hidden=tb==='zoek'};
/* ---------- weer per hoogte (MeteoSwiss) ---------- */
let WX=null,wxAt=0;
const WXI={sun:'<circle class="y" cx="12" cy="12" r="4.2"/><path class="y" d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/>',
 moon:'<path d="M19.5 14.5A8 8 0 019.5 4.5a8 8 0 1010 10z"/>',
 part:'<circle class="y" cx="8" cy="8.5" r="3.2"/><path class="y" d="M8 2.6v1.6M2.1 8.5h1.6M3.8 4.3l1.1 1.1M12.2 4.3l-1.1 1.1"/><path d="M8.5 19h8.7a3.3 3.3 0 00.4-6.6 4.6 4.6 0 00-8.8-.9A3.8 3.8 0 008.5 19z"/>',
 cloud:'<path d="M7 18.5h10a3.7 3.7 0 00.5-7.4 5.2 5.2 0 00-10-1A4.3 4.3 0 007 18.5z"/>',
 rain:'<path d="M7 15h10a3.7 3.7 0 00.5-7.4 5.2 5.2 0 00-10-1A4.3 4.3 0 007 15z"/><path class="b" d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/>',
 snow:'<path d="M7 15h10a3.7 3.7 0 00.5-7.4 5.2 5.2 0 00-10-1A4.3 4.3 0 007 15z"/><path class="b" d="M8.5 18.5v.1M12 20v.1M15.5 18.5v.1M10.2 21.3v.1M13.8 21.3v.1" stroke-width="2.2"/>'};
const wxIcon=(k,h)=>`<svg class="wxi" viewBox="0 0 24 24" aria-hidden="true">${WXI[(k==='sun'&&h!=null&&(h<8||h>16))?'moon':k]||WXI.cloud}</svg>`;
const deg=v=>v==null?'–':(Math.round(v)+'°').replace('-','−');
function drawWx(){const el=$('#wx');if(!el)return;
  if(!WX||!WX.pts||!WX.pts.length){el.innerHTML=`<div class="wxh"><h1>${t('wxH')}</h1></div><p class="wxz">${t('wxNo')}</p>`;return}
  const made=new Date(WX.made),old=Date.now()-made>6*36e5,loc=cur==='en'?'en-GB':cur;
  const ks=WX.pts.find(p=>p.k==='ks')||WX.pts[0],z=ks.h[0]&&ks.h[0][6];
  const open=[...el.querySelectorAll('details[open]')].map(d=>d.dataset.k);
  el.innerHTML=`<div class="wxh"><h1>${t('wxH')}</h1></div><p class="wxz">${z?t('wxZero')+' '+z.toLocaleString(loc)+' m · ':''}${t('wxUpd')} ${made.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'})}${old?'<br>'+t('wxOld'):''}</p>`+
   WX.pts.map(p=>{const n=p.h[0];if(!n)return'';const hh=+n[0].slice(11);
    return `<details class="lf wx" data-k="${p.k}"${open.includes(p.k)?' open':''}><summary><span class="nm">${esc(p.n)}<small>${p.alt.toLocaleString(loc)} M</small></span><span class="now">${wxIcon(n[5],hh)}<b>${deg(n[1])}</b><span class="wd">${n[4]==null?'':n[4]+' km/h'}</span></span></summary>
     <div class="wxhr">${p.h.slice(0,24).map(h=>`<div><small>${h[0].slice(11)}:00</small>${wxIcon(h[5],+h[0].slice(11))}<span>${deg(h[1])}</span><span class="pp">${h[2]>=0.1?h[2].toLocaleString(loc,{maximumFractionDigits:1})+' mm':''}</span></div>`).join('')}</div>
     <table class="wxd">${p.d.map((d,i)=>`<tr><td>${i===0?t('wxToday'):new Date(d[0]+'T12:00').toLocaleDateString(loc,{weekday:'short',day:'numeric',month:'short'})}</td><td>${wxIcon(d[5])}</td><td>${deg(d[1])} / ${deg(d[2])}</td><td class="mu">${d[3]>=0.1?d[3].toLocaleString(loc)+' mm':d[4].toLocaleString(loc)+' '+t('wxSun')}</td><td class="mu">${d[6]==null?'':d[6]+' km/h'}</td></tr>`).join('')}</table></details>`}).join('')+
   `<p class="wxsrc">${t("wxSrc")} · km/h = ${t("wxGust")}</p>`}
function loadWx(force){if(!force&&Date.now()-wxAt<10*6e4)return;wxAt=Date.now();
  fetch('data/weather.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.pts){WX=j;S.set('wx',j)}drawWx()}).catch(()=>drawWx())}
WX=S.get('wx',null);
const _ra=renderAll;renderAll=function(){_ra();drawWx()};
const _show2=show;show=function(tb,push){_show2(tb,push);if(curView==='liften')loadWx()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&curView==='liften')loadWx()});
drawWx();loadWx(true);
$('#main').addEventListener('scroll',()=>{if(curView!=='start')return;const q=$('#qa').getBoundingClientRect(),m=$('#main').getBoundingClientRect();$('#ibar').classList.toggle('on',q.bottom<m.top+4)},{passive:true});
renderAll();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
