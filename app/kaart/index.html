<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Firn – kaart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{--snow:#FFFFFF;--card:#F2F4F8;--ink:#0A1633;--muted:#4B5675;--hush:#C3C9D6;--line:#E3E7EF;--blue:#1C6DD0;--red:#D42A3A;--black:#16181D;--free:#E8A20A;--hi:#E8540A;--ice:#DCEBF5;--water:#BBD7EE}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--card);-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;background:#EEF1F6}
.top{position:fixed;left:0;right:0;top:0;z-index:1000;padding:calc(10px + env(safe-area-inset-top)) 14px 0;pointer-events:none}
.bar{display:flex;align-items:center;gap:10px;pointer-events:auto}
.brand{background:var(--snow);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font:500 12px "IBM Plex Mono",monospace;letter-spacing:.28em;text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;pointer-events:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--snow);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:9px 15px;font:400 14px "Hanken Grotesk",sans-serif;display:flex;align-items:center;gap:8px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--hush);flex:none}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[aria-pressed=true] i{background:#fff}
.chip.go{border-style:dashed}
.side{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1000;display:flex;flex-direction:column;gap:10px}
.rb{width:48px;height:48px;border-radius:50%;background:var(--snow);border:1px solid var(--line);color:var(--ink);font-size:22px;font-weight:300;display:grid;place-items:center}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}
.rb.on{background:var(--ink);color:#fff}
.legend{position:fixed;left:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:1000;background:var(--snow);border:1px solid var(--line);border-radius:14px;padding:9px 13px;display:flex;gap:13px;font:400 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend b{width:16px;height:4px;border-radius:2px;display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--snow);border-radius:22px 22px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(10,22,51,.12)}
.sheet.on{transform:none}
.sheet .label{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sheet .label i{width:10px;height:10px;border-radius:50%}
.sheet h2{margin:8px 0 0;font-weight:300;font-size:1.9rem;letter-spacing:-.02em;line-height:1.1}
.facts{display:flex;gap:26px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.facts div{font-size:13px;color:var(--muted)}.facts b{display:block;font-weight:300;font-size:1.5rem;color:var(--ink);letter-spacing:-.02em}
.sheet a{display:inline-block;margin-top:16px;border:1px solid var(--ink);border-radius:99px;padding:9px 18px;color:var(--ink);text-decoration:none;font-size:14px}
.hrt{position:absolute;right:62px;top:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;font-size:19px;line-height:1;color:var(--ink)}.hrt[aria-pressed=true]{color:#D42A3A;border-color:#D42A3A}
.sheet h2{padding-right:92px}
.x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;font-size:18px;color:var(--ink)}
.emb .bar{display:none}.emb .top{padding-top:4px}.emb .toast{top:70px}.emb .side{bottom:74px}.emb .legend{bottom:14px}.emb .rbar{bottom:58px}
.rbar{position:fixed;left:14px;right:76px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:1000;background:var(--ink);color:#fff;border-radius:14px;padding:11px 12px 11px 16px;display:none;align-items:center;gap:10px;font-size:14px}
.rbar.on{display:flex}.rbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rbar button{background:none;border:0;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--hi);border:3px solid #fff;box-shadow:0 2px 8px rgba(10,22,51,.35)}
.pin::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--hi);opacity:.55;animation:pulse 1.6s ease-out infinite}
.pin b{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font:500 13px "Hanken Grotesk",sans-serif;padding:6px 12px;border-radius:99px;box-shadow:0 2px 8px rgba(10,22,51,.25)}
@keyframes pulse{from{transform:scale(.55);opacity:.8}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin::before{animation:none}}
.stop{width:24px;height:24px;border-radius:50%;background:var(--hi);color:#fff;font:500 12px "IBM Plex Mono",monospace;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(10,22,51,.3);transform:translate(-50%,-50%);position:absolute}
.stopn{position:absolute;left:28px;top:3px;white-space:nowrap;font:500 12px "Hanken Grotesk",sans-serif;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff}
.toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top));transform:translateX(-50%);z-index:1200;background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1}
.lbl{white-space:nowrap;transform:translate(-50%,-50%);position:absolute;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 4px #fff}
.lbl.pl{font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.lbl.pl.k2{font-weight:400;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.lbl.pk{font:400 10.5px "IBM Plex Mono",monospace;color:var(--muted);text-align:center;line-height:1.25}
.lbl.pk::before{content:"▲";display:block;font-size:9px;color:var(--ink)}
.lbl.lf{font:500 10px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.lbl.st{font-size:11px;color:var(--muted)}
.z-lo .k2,.z-lo .lf,.z-lo .st,.z-lo .pkm{display:none}
.z-mid .pkm{display:none}
.z-mid .lf,.z-mid .st{display:none}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(10,22,51,.25);transform:translate(-50%,-50%);position:absolute}
.dot.food{background:var(--hi)}.dot.park{background:var(--ink);border-radius:3px}
.me{width:16px;height:16px;border-radius:50%;background:#1C6DD0;border:3px solid #fff;box-shadow:0 0 0 2px rgba(28,109,208,.35);transform:translate(-50%,-50%);position:absolute}
.leaflet-container{font-family:inherit;background:#EEF1F6}
.relief{mix-blend-mode:multiply}
.leaflet-control-attribution{font:400 10px "IBM Plex Mono",monospace;background:rgba(255,255,255,.8)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="bar"><span class="brand">Firn</span></div>
  <div class="chips" id="chips"></div>
</div>
<div class="side">
  <button class="rb" id="loc" aria-label="Mijn positie"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <button class="rb" id="zi" aria-label="Inzoomen">+</button>
  <button class="rb" id="zo" aria-label="Uitzoomen">−</button>
</div>
<div class="legend" id="lg"></div>
<div class="rbar" id="rbar"><span id="rbt"></span><button id="rbx" aria-label="×">×</button></div>
<div class="sheet" id="sheet" role="dialog" aria-live="polite"><button class="x" id="sx" aria-label="Sluiten">×</button><div id="sb"></div></div>
<div class="toast" id="toast"></div>
<script src="leaflet.js"></script>
<script src="map-data.js"></script>
<script>
(function(){
const D=window.FIRN_MAP,$=s=>document.querySelector(s);
const COL={b:'#1C6DD0',r:'#D42A3A',k:'#16181D',f:'#E8A20A'};
const TX={
 nl:{hike:'Wandelen',hikep:'Winterwandelpad',more:'Beschrijving in Firn',lifts:'Liften',sled:'Sleeën',food:'Eten',park:'Parkeren',blue:'Blauw',red:'Rood',black:'Zwart',lift:'Lift',piste:'Piste',noname:'Piste zonder naam',part:'dit deel',len:'lengte',pers:'personen',sledp:'Sleepiste',kitchen:'keuken',site:'Website',places:'plaatsen',fee:'tarief',paid:'Betaald',free:'Gratis',parkp:'Parkeerplaats',zoom:'Zoom in om alle punten te zien',nogeo:'Positie is op dit toestel niet beschikbaar',perm:'Geef toestemming voor je locatie om jezelf te zien',nofix:'Positie nu niet te bepalen',out:'Je bent nu buiten het skigebied',me:'Mijn positie',close:'Sluiten',
  d:{b:'makkelijk',r:'gemiddeld',k:'moeilijk',f:'niet geprepareerd'},dn:{b:'Blauw',r:'Rood',k:'Zwart',f:'Freeride'},lt:{gondola:'Gondel',cable_car:'Kabelbaan',chair_lift:'Stoeltjeslift',drag:'Sleeplift',rope_tow:'Touwlift',magic_carpet:'Loopband'},ft:{restaurant:'Restaurant',cafe:'Café',bar:'Bar',hut:'Berghut'}},
 en:{hike:'Hiking',hikep:'Winter hiking trail',more:'Description in Firn',lifts:'Lifts',sled:'Sledging',food:'Food',park:'Parking',blue:'Blue',red:'Red',black:'Black',lift:'Lift',piste:'Piste',noname:'Unnamed piste',part:'this section',len:'length',pers:'people',sledp:'Sledging run',kitchen:'cuisine',site:'Website',places:'spaces',fee:'fee',paid:'Paid',free:'Free',parkp:'Car park',zoom:'Zoom in to see all points',nogeo:'Location is not available on this device',perm:'Allow location access to see yourself',nofix:'Cannot get your position right now',out:'You are outside the ski area',me:'My position',close:'Close',
  d:{b:'easy',r:'intermediate',k:'difficult',f:'ungroomed'},dn:{b:'Blue',r:'Red',k:'Black',f:'Freeride'},lt:{gondola:'Gondola',cable_car:'Cable car',chair_lift:'Chairlift',drag:'Drag lift',rope_tow:'Rope tow',magic_carpet:'Magic carpet'},ft:{restaurant:'Restaurant',cafe:'Café',bar:'Bar',hut:'Mountain hut'}},
 de:{hike:'Wandern',hikep:'Winterwanderweg',more:'Beschreibung in Firn',lifts:'Lifte',sled:'Schlitteln',food:'Essen',park:'Parken',blue:'Blau',red:'Rot',black:'Schwarz',lift:'Lift',piste:'Piste',noname:'Piste ohne Namen',part:'dieser Abschnitt',len:'Länge',pers:'Personen',sledp:'Schlittelweg',kitchen:'Küche',site:'Website',places:'Plätze',fee:'Tarif',paid:'Kostenpflichtig',free:'Gratis',parkp:'Parkplatz',zoom:'Hineinzoomen, um alle Punkte zu sehen',nogeo:'Standort ist auf diesem Gerät nicht verfügbar',perm:'Standortzugriff erlauben, um dich zu sehen',nofix:'Standort gerade nicht bestimmbar',out:'Du bist ausserhalb des Skigebiets',me:'Mein Standort',close:'Schliessen',
  d:{b:'leicht',r:'mittel',k:'schwer',f:'nicht präpariert'},dn:{b:'Blau',r:'Rot',k:'Schwarz',f:'Freeride'},lt:{gondola:'Gondelbahn',cable_car:'Luftseilbahn',chair_lift:'Sesselbahn',drag:'Skilift',rope_tow:'Seillift',magic_carpet:'Förderband'},ft:{restaurant:'Restaurant',cafe:'Café',bar:'Bar',hut:'Berghütte'}},
 fr:{hike:'Randonnée',hikep:'Sentier hivernal',more:'Description dans Firn',lifts:'Remontées',sled:'Luge',food:'Manger',park:'Parking',blue:'Bleue',red:'Rouge',black:'Noire',lift:'Remontée',piste:'Piste',noname:'Piste sans nom',part:'ce tronçon',len:'longueur',pers:'personnes',sledp:'Piste de luge',kitchen:'cuisine',site:'Site web',places:'places',fee:'tarif',paid:'Payant',free:'Gratuit',parkp:'Parking',zoom:'Zoomez pour voir tous les points',nogeo:'Position indisponible sur cet appareil',perm:'Autorisez la localisation pour vous voir',nofix:'Position introuvable pour le moment',out:'Vous êtes hors du domaine skiable',me:'Ma position',close:'Fermer',
  d:{b:'facile',r:'moyenne',k:'difficile',f:'non damée'},dn:{b:'Bleue',r:'Rouge',k:'Noire',f:'Freeride'},lt:{gondola:'Télécabine',cable_car:'Téléphérique',chair_lift:'Télésiège',drag:'Téléski',rope_tow:'Fil-neige',magic_carpet:'Tapis roulant'},ft:{restaurant:'Restaurant',cafe:'Café',bar:'Bar',hut:'Cabane'}}};
let LG='nl';try{const q=new URLSearchParams(location.search).get('lang')||JSON.parse(localStorage.getItem('jf_lang')||'null')||(navigator.language||'nl').slice(0,2);if(TX[q])LG=q}catch(e){}
const T=k=>TX[LG][k]||TX.nl[k]||k,ltn=t=>T('lt')[t]||T('lt')[/bar|platter|drag/.test(t)?'drag':'']||T('lift');
if(self!==top)document.body.classList.add('emb');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const km=m=>m>=1000?(m/1000).toFixed(1).replace('.',',')+' km':m+' m';
const BOUNDS=L.latLngBounds([46.52,7.80],[46.70,8.13]);
const map=L.map('map',{zoomControl:false,minZoom:11,maxZoom:17,maxBounds:BOUNDS.pad(.25),zoomSnap:.25,renderer:L.canvas({tolerance:12,padding:.4}),attributionControl:true});
map.attributionControl.setPrefix(false).addAttribution('Kaartdata © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>');
map.fitBounds(L.latLngBounds(D.pistes.flatMap(p=>[p.c[0],p.c[p.c.length-1]])).pad(.04));
L.tileLayer('relief/{z}/{x}/{y}.jpg',{minNativeZoom:11,maxNativeZoom:14,bounds:BOUNDS,opacity:.45,className:'relief',attribution:'Reliëf © <a href="https://www.swisstopo.admin.ch" target="_blank" rel="noopener">swisstopo</a>'}).addTo(map);
const G={};['base','areas','hike','sled','pistes','lifts','labels','food','parking'].forEach(k=>G[k]=L.layerGroup());
// ondergrond
(D.ice||[]).forEach(r=>L.polygon(r,{stroke:false,fillColor:'#DCEBF5',fillOpacity:.9,interactive:false}).addTo(G.base));
(D.water||[]).forEach(r=>L.polygon(r,{stroke:false,fillColor:'#BBD7EE',fillOpacity:1,interactive:false}).addTo(G.base));
(D.rivers||[]).forEach(c=>L.polyline(c,{color:'#BBD7EE',weight:2.5,interactive:false}).addTo(G.base));
(D.roads||[]).forEach(c=>L.polyline(c,{color:'#FFFFFF',weight:3,interactive:false}).addTo(G.base));
D.rail.forEach(r=>{L.polyline(r.c,{color:'#8E97AC',weight:r.u?1:2.2,dashArray:r.u?'2 5':null,interactive:false}).addTo(G.base);if(!r.u)L.polyline(r.c,{color:'#EEF1F6',weight:1,dashArray:'5 5',interactive:false}).addTo(G.base)});
D.areas.forEach(a=>L.polygon(a.c,{stroke:false,fillColor:COL[a.d],fillOpacity:.14,interactive:false}).addTo(G.areas));
// pistes: wit randje eronder, kleur erboven
let hl=null;
const favGet=()=>{try{return JSON.parse(localStorage.getItem('jf_fav2')||'[]')}catch(e){return[]}};
function heart(key){if(!key)return'';const on=favGet().includes(key);return `<button class="hrt" data-fk="${esc(key)}" aria-pressed="${on}" aria-label="♥">${on?'♥':'♡'}</button>`}
const PL=[],LL=[],FL=[];let CUR={};
function pick(layer,html){if(hl){hl.remove();hl=null}
  if(layer){hl=L.polyline(layer.getLatLngs(),{color:'#E8540A',weight:13,opacity:.6,interactive:false}).addTo(map);}
  $('#sb').innerHTML=html;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');if(hl){hl.remove();hl=null}if(typeof RL!=='undefined'&&!$('#rbar').classList.contains('on'))RL.clearLayers()}
$('#sx').onclick=closeSheet;
$('#sb').addEventListener('click',e=>{const h=e.target.closest('[data-fk]');if(h){const k=h.dataset.fk,f=favGet(),i=f.indexOf(k);i<0?f.push(k):f.splice(i,1);try{localStorage.setItem('jf_fav2',JSON.stringify(f))}catch(x){}h.setAttribute('aria-pressed',i<0);h.textContent=i<0?'♥':'♡';return}
  const a=e.target.closest('[data-eat]');if(a){e.preventDefault();if(self!==top)parent.postMessage({firn:1,k:'eat',id:a.dataset.eat},location.origin)}});
D.pistes.forEach(p=>L.polyline(p.c,{color:'#fff',weight:5.5,interactive:false}).addTo(G.pistes));
const pname=p=>p.n&&p.n!==p.ref?p.n:p.ref?T('piste')+' '+p.ref:'';
D.pistes.forEach((p,i)=>{const l=L.polyline(p.c,{color:COL[p.d],weight:3.2,dashArray:p.d==='f'?'6 6':null}).addTo(G.pistes);
  PL[i]=()=>{pick(l,`${heart(pname(p)?'p:'+pname(p):'')}<span class="label"><i style="background:${COL[p.d]}"></i>${T('piste')}${p.ref?' '+esc(p.ref):''}</span><h2>${esc(p.n&&p.n!==p.ref?p.n:p.ref?T('piste')+' '+p.ref:T('noname'))}</h2><div class="facts"><div><b>${km(p.m)}</b>${T('part')}</div><div><b>${T('dn')[p.d]}</b>${T('d')[p.d]}</div></div>`);return l};l.on('click',e=>{L.DomEvent.stop(e);PL[i]()})});
D.sled.forEach(s=>{const l=L.polyline(s.c,{color:'#7A4FD0',weight:2.6,dashArray:'2 6',lineCap:'round'}).addTo(G.sled);
  l.on('click',e=>{L.DomEvent.stop(e);pick(l,`<span class="label"><i style="background:#7A4FD0"></i>${T('sledp')}</span><h2>${esc(s.n||T('sledp'))}</h2><div class="facts"><div><b>${km(s.m)}</b>${T('part')}</div></div>`)})});
(D.hike||[]).forEach(s=>{const l=L.polyline(s.c,{color:'#1F8A6B',weight:2.6,dashArray:'1 6',lineCap:'round'}).addTo(G.hike);
  l.on('click',e=>{L.DomEvent.stop(e);pick(l,`<span class="label"><i style="background:#1F8A6B"></i>${T('hikep')}</span><h2>${esc(s.n||T('hikep'))}</h2><div class="facts"><div><b>${km(s.m)}</b>${T('part')}</div></div>`)})});
D.lifts.forEach((f,i)=>{const big=f.t==='gondola'||f.t==='cable_car',l=L.polyline(f.c,{color:'#0A1633',weight:big?2.6:1.8}).addTo(G.lifts);
  [f.c[0],f.c[f.c.length-1]].forEach(p=>L.circleMarker(p,{radius:big?4:3,color:'#0A1633',weight:1.5,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(G.lifts));
  LL[i]=()=>{pick(l,`${heart(f.n?'l:'+f.n:'')}<span class="label"><i style="background:#0A1633"></i>${ltn(f.t)}</span><h2>${esc(f.n||T('lift'))}</h2><div class="facts"><div><b>${km(f.m)}</b>${T('len')}</div>${f.cap?`<div><b>${esc(f.cap)}</b>${T('pers')}</div>`:''}</div>`);return l};l.on('click',e=>{L.DomEvent.stop(e);LL[i]()});
  if(f.n&&f.m>350){const m=f.c[Math.floor(f.c.length/2)];L.marker(m,{interactive:false,icon:L.divIcon({className:'',html:`<span class="lbl lf">${esc(f.n)}</span>`})}).addTo(G.labels)}});
// labels
const seen={};
D.places.forEach(p=>L.marker(p.p,{interactive:false,icon:L.divIcon({className:'',html:`<span class="lbl pl ${p.k===2?'k2':''}">${esc(p.n)}</span>`})}).addTo(G.labels));
D.peaks.forEach((p,i)=>L.marker(p.p,{interactive:false,icon:L.divIcon({className:'',html:`<span class="lbl pk ${p.k?'pkm':''}">${esc(p.n)}<br>${p.e}</span>`})}).addTo(G.labels));
D.stations.forEach(s=>{if(D.places.some(p=>p.n===s.n))return;L.marker(s.p,{interactive:false,icon:L.divIcon({className:'',html:`<span class="lbl st">${esc(s.n)}</span>`})}).addTo(G.labels)});
// eten en parkeren
D.food.forEach((f,i)=>{FL[i]=()=>pick(null,`${CUR[i]?'':heart('f:'+f.n)}<span class="label"><i style="background:#E8540A"></i>${T('ft')[f.t]||T('food')}</span><h2>${esc(f.n)}</h2>${f.c?`<div class="facts"><div><b style="font-size:1.1rem">${esc(f.c.replace(/[;_]/g,' · '))}</b>${T('kitchen')}</div></div>`:''}${/^https?:\/\//.test(f.w)?`<a href="${esc(f.w)}" target="_blank" rel="noopener">${T('site')} ↗</a>`:''}${CUR[i]?` <a href="#" data-eat="${CUR[i]}">${T('more')}</a>`:''}`);L.marker(f.p,{icon:L.divIcon({className:'',html:'<span class="dot food"></span>',iconSize:[24,24]})}).addTo(G.food).on('click',()=>FL[i]())});
D.parking.forEach(k=>L.marker(k.p,{icon:L.divIcon({className:'',html:'<span class="dot park"></span>',iconSize:[24,24]})}).addTo(G.parking).on('click',()=>pick(null,`<span class="label"><i style="background:#0A1633;border-radius:2px"></i>${T('park')}</span><h2>${esc(k.n||T('parkp'))}</h2><div class="facts">${k.cap?`<div><b>${k.cap}</b>${T('places')}</div>`:''}${k.fee?`<div><b>${k.fee==='yes'?T('paid'):k.fee==='no'?T('free'):esc(k.fee)}</b>${T('fee')}</div>`:''}</div>`)));
['base','areas','pistes','lifts','labels'].forEach(k=>G[k].addTo(map));
map.on('click',closeSheet);
function zc(){const z=map.getZoom(),c=map.getContainer().classList;c.toggle('z-lo',z<12.75);c.toggle('z-mid',z>=12.75&&z<14)}
map.on('zoomend',zc);zc();
// chips
const LAYERS=[['lifts','lifts',1],['food','food',0],['sled','sled',0],['hike','hike',0],['parking','park',0]];
const GO=[['Wengen',[46.596,7.935],14],['Mürren',[46.560,7.880],14],['Grindelwald',[46.622,8.020],13.5],['First',[46.659,8.060],14]];
const ON={lifts:1};
function chrome(){$('#chips').innerHTML=LAYERS.map(l=>`<button class="chip" data-l="${l[0]}" aria-pressed="${!!ON[l[0]]}"><i></i>${T(l[1])}</button>`).join('')+GO.map((g,i)=>`<button class="chip go" data-g="${i}">${g[0]}</button>`).join('');
  $('#lg').innerHTML=`<span><b style="background:var(--blue)"></b>${T('blue')}</span><span><b style="background:var(--red)"></b>${T('red')}</span><span><b style="background:var(--black)"></b>${T('black')}</span><span><b style="background:var(--ink);height:2px"></b>${T('lift')}</span>`;$('#loc').setAttribute('aria-label',T('me'));$('#sx').setAttribute('aria-label',T('close'));document.documentElement.lang=LG}
chrome();
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
  if(b.dataset.g){const g=GO[b.dataset.g];map.flyTo(g[1],g[2],{duration:.8});return}
  const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const k=b.dataset.l;ON[k]=on;on?G[k].addTo(map):G[k].remove();
  if(on&&(k==='food'||k==='parking')&&map.getZoom()<13)toast(T('zoom'))};
$('#zi').onclick=()=>map.zoomIn(1);$('#zo').onclick=()=>map.zoomOut(1);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
// eigen positie
let me=null,acc=null,watch=null,follow=false;
$('#loc').onclick=()=>{
  if(!navigator.geolocation){toast(T('nogeo'));return}
  if(watch!==null&&me){map.flyTo(me.getLatLng(),Math.max(map.getZoom(),15),{duration:.6});return}
  follow=true;$('#loc').classList.add('on');
  try{watch=navigator.geolocation.watchPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];
    if(!me){me=L.marker(ll,{interactive:false,zIndexOffset:1000,icon:L.divIcon({className:'',html:'<span class="me"></span>'})}).addTo(map);acc=L.circle(ll,{radius:p.coords.accuracy,stroke:false,fillColor:'#1C6DD0',fillOpacity:.12,interactive:false}).addTo(map)}
    else{me.setLatLng(ll);acc.setLatLng(ll).setRadius(p.coords.accuracy)}
    if(follow){follow=false;if(BOUNDS.contains(ll))map.flyTo(ll,15,{duration:.8});else toast(T('out'))}},
   err=>{$('#loc').classList.remove('on');watch=null;toast(err.code===1?T('perm'):T('nofix'))},
   {enableHighAccuracy:true,maximumAge:5000,timeout:15000})}catch(e){$('#loc').classList.remove('on');toast(T('nogeo'))}};
// berichten van de app: route tonen, naar een plek gaan, taal wisselen
const RL=L.layerGroup().addTo(map);
function clearRoute(){RL.clearLayers();$('#rbar').classList.remove('on')}
function pin(p,n){RL.clearLayers();L.marker(p,{interactive:false,zIndexOffset:950,icon:L.divIcon({className:'',html:`<span class="pin">${n?`<b>${esc(n)}</b>`:''}</span>`})}).addTo(RL)}
function focusOn(p,z){map.setView(p,z,{animate:false});const h=$('#sheet').classList.contains('on')?$('#sheet').offsetHeight:0;if(h)map.panBy([0,h/2],{animate:false})}
$('#rbx').onclick=clearRoute;
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||!e.data.firn)return;const m=e.data;
  if(m.lang&&TX[m.lang]&&m.lang!==LG){LG=m.lang;chrome();closeSheet()}
  if(m.k==='size')map.invalidateSize();
  if(m.k==='cur'&&m.m)CUR=m.m;
  if(m.k==='layer'&&G[m.l]){map.invalidateSize();ON[m.l]=!!m.on;m.on?G[m.l].addTo(map):G[m.l].remove();chrome();if(m.on&&map.getZoom()<13)toast(T('zoom'))}
  if(m.k==='pick'){map.invalidateSize();clearRoute();
    if(m.kind==='food'&&FL[m.i]){if(!ON.food){ON.food=1;G.food.addTo(map);chrome()}FL[m.i]();pin(D.food[m.i].p,D.food[m.i].n);focusOn(D.food[m.i].p,15)}
    const fn=m.kind==='piste'?PL[m.i]:m.kind==='lift'?LL[m.i]:null;if(fn){if(m.kind==='lift'&&!ON.lifts){ON.lifts=1;G.lifts.addTo(map);chrome()}const l=fn();map.fitBounds(l.getBounds().pad(.35),{maxZoom:15,paddingBottomRight:[0,170],animate:false})}}
  if(m.k==='route'&&m.pts&&m.pts.length){map.invalidateSize();closeSheet();RL.clearLayers();
    m.pts.forEach((s,i)=>L.marker(s.p,{interactive:false,zIndexOffset:900,icon:L.divIcon({className:'',html:`<span class="stop">${i+1}<span class="stopn">${esc(s.n)}</span></span>`})}).addTo(RL));
    $('#rbt').textContent=m.title||'';$('#rbar').classList.add('on');map.fitBounds(L.latLngBounds(m.pts.map(s=>s.p)).pad(.25),{maxZoom:15})}
  if(m.k==='go'&&m.p){map.invalidateSize();clearRoute();closeSheet();pin(m.p,m.n);map.setView(m.p,m.z||15,{animate:false})}});
window.FIRN={map,G,D};
})();
</script>
</body>
</html>
