name: Proef
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -D - -o /tmp/a.json -H "Origin: https://jaapschip.github.io" "https://transport.opendata.ch/v1/connections?from=Lauterbrunnen&to=Wengen&limit=2" | grep -i -E "HTTP|access-control|content-type|ratelimit"
          python3 -c "
          import json;d=json.load(open('/tmp/a.json'));c=d['connections'][0];print(json.dumps({k:c[k] for k in ('duration','transfers','products')}));print(json.dumps(c['from'])[:700]);print(json.dumps(c['to'])[:300])"
          for q in "Stechelberg, Schilthornbahn|Mürren" "Lauterbrunnen|Mürren BLM" "Interlaken Ost|Grindelwald" "Grindelwald Terminal|Eigergletscher" "Wengen|Männlichen"; do f=${q%|*}; t=${q#*|}; curl -sS -G --data-urlencode "from=$f" --data-urlencode "to=$t" --data-urlencode "limit=1" https://transport.opendata.ch/v1/connections | python3 -c "
          import json,sys;d=json.load(sys.stdin);c=d.get('connections',[]);print(d.get('from',{}).get('name'),'->',d.get('to',{}).get('name'),len(c),c[0]['from']['departure'] if c else '',c[0]['duration'] if c else '',c[0]['products'] if c else '')"; done
