name: Kaartdata ophalen (OpenStreetMap)
on:
  workflow_dispatch:
  push:
    paths: ['data/osm-query.txt', '.github/workflows/osm.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overpass
        run: |
          ok=0
          for try in 1 2 3; do
            for host in overpass-api.de overpass.private.coffee overpass.kumi.systems; do
              if curl -sS --fail -m 300 -A "firn-app (github.com/JaapSchip/firn)" --data-urlencode "data@data/osm-query.txt" "https://$host/api/interpreter" -o /tmp/osm.json && grep -q '"elements"' /tmp/osm.json; then ok=1; break 2; fi
              sleep 30
            done
          done
          test "$ok" = 1
          mv /tmp/osm.json data/osm.json
          ls -la data
      - name: Commit
        run: |
          git config user.name "firn-bot"
          git config user.email "firn-bot@users.noreply.github.com"
          python3 tools/build_map.py
          git add data/osm.json app/kaart/map-data.js
          git diff --cached --quiet || git commit -m "Kaartdata bijgewerkt (© OpenStreetMap, ODbL)"
          git push
