name: App online zetten (met actueel weer)
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths: ['app/**', 'tools/fetch_weather.py', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Weer ophalen (MeteoSwiss)
        continue-on-error: true
        run: python3 tools/fetch_weather.py
      - name: Versie invullen
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" app/index.html app/kaart/index.html app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
